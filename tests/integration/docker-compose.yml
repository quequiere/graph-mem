services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'nomic-embed-text' && ollama list | grep -q 'qwen2.5:3b'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        SERVER_PID=$$!
        until ollama list > /dev/null 2>&1; do sleep 2; done
        ollama pull nomic-embed-text
        ollama pull qwen2.5:3b
        echo "All models ready."
        wait $$SERVER_PID

  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/graphiti-test
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  graphiti:
    build:
      context: ./graphiti
      dockerfile: Dockerfile
    ports:
      - "8000"
    environment:
      - OPENAI_API_KEY=ollama
      # OLLAMA_URL env var lets callers point to their own Ollama instance.
      # Default: host.docker.internal:11434 reaches the host's local Ollama.
      - OPENAI_BASE_URL=${OLLAMA_URL:-http://host.docker.internal:11434}/v1
      - MODEL_NAME=${OLLAMA_MODEL:-qwen2.5:3b}
      - EMBEDDING_MODEL_NAME=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphiti-test
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  ollama_data:
    name: graphmem-integration-ollama-data
