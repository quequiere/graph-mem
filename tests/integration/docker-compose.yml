services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'qwen3-embedding:4b' && ollama list | grep -q 'gemma3:4b'"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 30s
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        SERVER_PID=$$!
        until ollama list > /dev/null 2>&1; do sleep 2; done
        ollama pull gemma3:4b
        ollama pull qwen3-embedding:4b
        echo "All models ready."
        wait $$SERVER_PID

  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/graphiti-test
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  graphiti:
    build:
      # Build from the repo-root graphiti/ folder so integration tests exercise
      # the exact same patch that ships in production (avoids drift with the
      # legacy standalone patch that used to live under tests/integration/graphiti).
      context: ../../graphiti
      dockerfile: Dockerfile
    ports:
      - "8000"
    environment:
      # LLM (OLLAMA_URL lets callers point to their own Ollama instance;
      # default host.docker.internal:11434 reaches the host's local Ollama).
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=${OLLAMA_URL:-http://host.docker.internal:11434}/v1
      - MODEL_NAME=${OLLAMA_MODEL:-gemma3:4b}
      # Embedder — decoupled from LLM since the fail-loud patch in
      # graphiti/zep_graphiti.py. Point it at the same Ollama instance.
      - EMBEDDING_API_KEY=ollama
      - EMBEDDING_BASE_URL=${OLLAMA_URL:-http://host.docker.internal:11434}/v1
      - EMBEDDING_MODEL_NAME=${OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphiti-test
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false

volumes:
  ollama_data:
    name: graphmem-integration-ollama-data
