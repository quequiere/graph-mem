name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint PR — validate PR title follows Conventional Commits
  # ---------------------------------------------------------------------------
  lint-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Lint Python — ruff check
  # ---------------------------------------------------------------------------
  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

  # ---------------------------------------------------------------------------
  # Unit tests — matrix across Python versions
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

  # ---------------------------------------------------------------------------
  # Build — validate Docker image builds (no push)
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./graphiti
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Integration tests — full stack with Neo4j + Graphiti + Ollama
  # ---------------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra integration

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ollama/models
          key: ollama-models-gemma3-4b-qwen3-embedding-4b

      - name: Pull models
        run: |
          ollama serve &
          sleep 5
          ollama pull gemma3:4b
          ollama pull qwen3-embedding:4b

      - name: Start Neo4j and Graphiti
        run: |
          docker compose -f tests/integration/docker-compose.yml \
            -p graphmem-integration \
            up --build -d neo4j graphiti
        env:
          OLLAMA_URL: http://172.17.0.1:11434

      - name: Wait for Graphiti
        run: |
          for i in $(seq 1 60); do
            PORT=$(docker inspect graphmem-integration-graphiti-1 \
              --format '{{(index (index .NetworkSettings.Ports "8000/tcp") 0).HostPort}}' 2>/dev/null)
            if [ -n "$PORT" ] && curl -sf --max-time 5 "http://127.0.0.1:$PORT/healthcheck" | grep -q healthy; then
              echo "Graphiti healthy on port $PORT"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          docker compose -f tests/integration/docker-compose.yml -p graphmem-integration logs graphiti
          exit 1

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v -m integration

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/integration/docker-compose.yml \
            -p graphmem-integration down
