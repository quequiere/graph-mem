[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-mem"
version = "0.1.0"
description = "Persistent intelligent memory for AI coding assistants using knowledge graphs"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
graph-mem = "graph_mem.server:main"
graph-mem-session-start = "graph_mem.hooks.session_start:main"
graph-mem-session-end = "graph_mem.hooks.session_end:main"
graph-mem-user-prompt = "graph_mem.hooks.user_prompt:main"
graph-mem-ingest = "graph_mem.hooks._ingest_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_mem"]
artifacts = ["src/graph_mem/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests requiring Docker (Neo4j + Graphiti + Ollama)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.11",
]
integration = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-docker>=3.0",
    "anyio>=4.0",
    "httpx>=0.27.0",
]
